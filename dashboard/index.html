<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Command Center</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --card-bg: #24283b;
            --text-main: #a9b1d6;
            --accent: #7aa2f7;
            --success: #9ece6a;
            --danger: #f7768e;
            --warning: #e0af68;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }

        /* ESTADÍSTICAS */
        .stats-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #414868;
        }

        .stat-number { font-size: 2em; font-weight: bold; color: var(--white); }
        .stat-label { font-size: 0.9em; opacity: 0.8; }

        /* SERVIDORES */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .server-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.2s;
            border-top: 5px solid gray; /* Default state */
            position: relative;
        }

        .server-card:hover { transform: translateY(-5px); }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: gray;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-start { background-color: var(--success); color: #1a1b26; }
        .btn-stop { background-color: var(--danger); color: white; }
        .btn-reboot { background-color: var(--warning); color: #1a1b26; }

        /* Utility classes for dynamic status */
        .running { border-color: var(--success); }
        .running .status-dot { background-color: var(--success); color: var(--success); }
        
        .stopped { border-color: var(--danger); }
        .stopped .status-dot { background-color: var(--danger); color: var(--danger); }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); color: white;
            display: none; justify-content: center; align-items: center;
            z-index: 100; font-size: 1.5em;
        }
    </style>
</head>
<body>

    <h1>🚀 Panel de Control de Servidores</h1>

    <div class="stats-panel">
        <div class="stat-card">
            <div id="total-servers" class="stat-number">-</div>
            <div class="stat-label">Servidores Totales</div>
        </div>
        <div class="stat-card">
            <div id="active-servers" class="stat-number" style="color: var(--success)">-</div>
            <div class="stat-label">Activos Ahora</div>
        </div>
        <div class="stat-card">
            <div id="last-update" class="stat-number" style="font-size: 1.2em; line-height: 1.8em;">--:--</div>
            <div class="stat-label">Última Actualización</div>
        </div>
    </div>

    <div id="server-grid" class="grid">
        <p>Conectando con el Backend...</p>
    </div>

    <div id="loading" class="loading-overlay">Procesando comando...</div>

    <script>
        // CONFIGURACIÓN: Apuntamos al backend local
        const API_URL = 'http://localhost:8000'; 

        async function fetchStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();
                renderServers(data.vms);
                updateStats(data.vms);
            } catch (error) {
                console.error("Error conectando:", error);
                document.getElementById('server-grid').innerHTML = 
                    `<p style="color:var(--danger)">⚠️ Error de conexión. Asegúrate de que backend.sh está ejecutándose.<br>
                    Si estás en GitHub Pages, verifica el permiso de "Contenido mixto" (candado en la barra).</p>`;
            }
        }

        function updateStats(vms) {
            const total = vms.length;
            const active = vms.filter(vm => vm.status === 'running').length;
            
            document.getElementById('total-servers').innerText = total;
            document.getElementById('active-servers').innerText = active;
            
            const now = new Date();
            document.getElementById('last-update').innerText = 
                now.toLocaleTimeString();
        }

        function renderServers(vms) {
            const grid = document.getElementById('server-grid');
            grid.innerHTML = '';

            vms.forEach(vm => {
                const isRunning = vm.status === 'running';
                const statusClass = isRunning ? 'running' : 'stopped';
                const statusText = isRunning ? 'ACTIVO' : 'DETENIDO';

                const card = document.createElement('div');
                card.className = `server-card ${statusClass}`;
                card.innerHTML = `
                    <div class="server-header">
                        <h2>${vm.name}</h2>
                        <div class="status-indicator">
                            <span class="status-dot"></span> ${statusText}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-start" onclick="sendCommand('start', '${vm.name}')" ${isRunning ? 'disabled' : ''}>
                            ▶ Iniciar
                        </button>
                        <button class="btn-stop" onclick="sendCommand('stop', '${vm.name}')" ${!isRunning ? 'disabled' : ''}>
                            ⏹ Detener
                        </button>
                        <button class="btn-reboot" onclick="sendCommand('reboot', '${vm.name}')" ${!isRunning ? 'disabled' : ''}>
                            🔄 Reiniciar
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function sendCommand(action, name) {
            document.getElementById('loading').style.display = 'flex';
            try {
                await fetch(`${API_URL}/${action}?name=${name}`);
                // Esperamos un poco para que VirtualBox procese antes de recargar estado
                setTimeout(() => {
                    fetchStatus();
                    document.getElementById('loading').style.display = 'none';
                }, 2000);
            } catch (error) {
                alert('Error enviando comando');
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Actualizar automáticamente cada 5 segundos
        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
