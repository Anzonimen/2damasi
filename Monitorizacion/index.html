<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT_TERMINAL_ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --term-green: #00ff41;
            --term-dim: #008F11;
            --err: #ff0000;
            --warn: #ffb000;
            --cyan: #00ffff;
            --grid-line: rgba(0, 255, 65, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--term-green);
            font-family: 'Fira Code', monospace;
            margin: 0; padding: 20px;
            height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            border: 2px solid var(--term-green);
            padding: 15px; margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 15px var(--term-dim);
            background: rgba(0,0,0,0.8);
        }
        h1 { margin: 0; font-size: 1.8rem; text-shadow: 0 0 5px var(--term-green); }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* HOST STATS */
        .stats-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            margin-bottom: 30px; font-size: 0.9rem;
        }
        .stat-item { border: 1px solid var(--term-dim); padding: 10px; text-align: center; }
        .val { font-weight: bold; font-size: 1.2rem; color: var(--cyan); }

        /* VM GRID */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
        }

        /* HACKER CARD */
        .card {
            border: 1px solid var(--term-green);
            background: rgba(0, 10, 0, 0.9);
            padding: 0;
            transition: 0.2s;
            position: relative;
        }
        .card:hover { box-shadow: 0 0 20px var(--term-dim); transform: translateY(-2px); }
        
        .card-top {
            background: var(--term-green); color: black; padding: 5px 10px; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .card-body { padding: 15px; }

        .specs-table { width: 100%; font-size: 0.8rem; color: var(--term-dim); margin-bottom: 15px; }
        .specs-table td { padding: 2px 0; }
        .highlight { color: var(--cyan); }

        /* COMMAND MATRIX */
        .cmd-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        
        button {
            background: black; color: var(--term-green); border: 1px solid var(--term-dim);
            padding: 8px; font-family: 'Fira Code', monospace; cursor: pointer;
            font-size: 0.75rem; text-transform: uppercase; transition: 0.1s;
        }
        button:hover { background: var(--term-green); color: black; }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; color: #555; }

        /* Special Buttons */
        .btn-spy { grid-column: span 3; border-color: var(--cyan); color: var(--cyan); margin-top: 5px; }
        .btn-spy:hover { background: var(--cyan); color: black; }
        
        .btn-danger { color: var(--err); border-color: var(--err); }
        .btn-danger:hover { background: var(--err); color: white; }

        /* LOGS */
        .console {
            position: fixed; bottom: 0; left: 0; right: 0; height: 120px;
            background: black; border-top: 2px solid var(--term-green);
            padding: 10px; font-size: 0.8rem; overflow-y: scroll;
            opacity: 0.9;
        }
        .log-entry { margin-bottom: 2px; }
        .log-ts { color: #555; margin-right: 10px; }

        /* SPY MODAL */
        #spy-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #spy-img { max-width: 90%; max-height: 80%; border: 2px solid var(--cyan); box-shadow: 0 0 50px var(--cyan); }
        .close-btn { margin-top: 20px; padding: 10px 30px; font-size: 1.2rem; background: var(--err); color: white; border: none; cursor: pointer; }

    </style>
</head>
<body>

    <header>
        <h1>> VBOX_MASTER_CONTROL<span class="blink">_</span></h1>
        <div style="text-align: right; font-size: 0.8rem;">
            SECURE CONNECTION<br>ENCRYPTION: AES-256
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">HOST CPU <div id="h-cpu" class="val">0%</div></div>
        <div class="stat-item">HOST RAM <div id="h-ram" class="val">0%</div></div>
        <div class="stat-item">TOTAL VMs <div id="vm-count" class="val">0</div></div>
        <div class="stat-item">ACTIVE <div id="vm-active" class="val" style="color:var(--term-green)">0</div></div>
    </div>

    <div id="grid" class="grid">
        </div>

    <div class="console" id="console">
        <div class="log-entry">> INITIALIZING SYSTEM... DONE</div>
        <div class="log-entry">> WAITING FOR HOST DATA...</div>
    </div>

    <div id="spy-modal">
        <img id="spy-img" src="" alt="Live Capture">
        <button class="close-btn" onclick="closeSpy()">CLOSE TRANSMISSION</button>
    </div>

    <script>
        const API = 'http://localhost:8000';

        async function loop() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                render(data);
            } catch (e) {
                log('CONNECTION_ERROR: Retrying handshake...', 'red');
            }
        }

        function render(data) {
            // Stats
            document.getElementById('h-cpu').innerText = data.host.cpu + '%';
            document.getElementById('h-ram').innerText = data.host.ram + '%';
            document.getElementById('vm-count').innerText = data.vms.length;
            document.getElementById('vm-active').innerText = data.vms.filter(v => v.status === 'running').length;

            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            data.vms.forEach(vm => {
                const s = vm.specs;
                const status = vm.status.toUpperCase();
                const isRun = vm.status === 'running';
                const isPaused = vm.status === 'paused';
                const color = isRun ? 'var(--term-green)' : (isPaused ? 'var(--warn)' : '#555');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-top" style="background:${color}; color:${isRun ? 'black' : 'white'}">
                        <span>${vm.name}</span>
                        <span>[${status}]</span>
                    </div>
                    <div class="card-body">
                        <table class="specs-table">
                            <tr><td>OS TYPE:</td> <td class="highlight">${s.os || 'Unknown'}</td></tr>
                            <tr><td>MEMORY:</td> <td class="highlight">${s.ram}</td></tr>
                            <tr><td>VRAM:</td> <td class="highlight">${s.vram}</td></tr>
                            <tr><td>MAC ADDR:</td> <td class="highlight">${s.mac || '--:--:--'}</td></tr>
                        </table>

                        <div class="cmd-grid">
                            <button onclick="cmd('${vm.name}', 'start')" ${isRun || isPaused ? 'disabled' : ''}>BOOT</button>
                            <button onclick="cmd('${vm.name}', 'pause')" ${!isRun ? 'disabled' : ''}>PAUSE</button>
                            <button onclick="cmd('${vm.name}', 'resume')" ${!isPaused ? 'disabled' : ''}>RESUME</button>
                            
                            <button onclick="cmd('${vm.name}', 'acpi')" ${!isRun ? 'disabled' : ''}>ACPI_OFF</button>
                            <button onclick="cmd('${vm.name}', 'reset')" ${!isRun ? 'disabled' : ''}>RESET</button>
                            <button class="btn-danger" onclick="cmd('${vm.name}', 'stop')" ${!isRun && !isPaused ? 'disabled' : ''}>KILL</button>

                            <button onclick="cmd('${vm.name}', 'snapshot')">SAVE</button>
                            <button onclick="cmd('${vm.name}', 'restore')" style="color:var(--cyan)">RESTORE</button>
                            <button class="btn-spy" onclick="spy('${vm.name}')" ${!isRun ? 'disabled' : ''}>👁️ CAPTURE SCREEN</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function cmd(name, action) {
            log(`EXECUTING: ${action.toUpperCase()} >> ${name}`);
            await fetch(`${API}/${action}?name=${name}`);
            setTimeout(loop, 500);
        }

        async function spy(name) {
            log(`INITIATING VISUAL INTERCEPT >> ${name}...`);
            const btn = event.target;
            btn.innerText = "DOWNLOADING...";
            
            try {
                const res = await fetch(`${API}/screenshot?name=${name}`);
                const data = await res.json();
                
                if(data.status === 'ok') {
                    document.getElementById('spy-img').src = "data:image/png;base64," + data.image;
                    document.getElementById('spy-modal').style.display = 'flex';
                } else {
                    alert("CAPTURE FAILED: " + data.msg);
                }
            } catch(e) { log("SPY_MODULE ERROR"); }
            
            btn.innerText = "👁️ CAPTURE SCREEN";
        }

        function closeSpy() {
            document.getElementById('spy-modal').style.display = 'none';
        }

        function log(msg, color) {
            const c = document.getElementById('console');
            const ts = new Date().toLocaleTimeString();
            c.innerHTML += `<div class="log-entry" style="color:${color || 'inherit'}"><span class="log-ts">[${ts}]</span> ${msg}</div>`;
            c.scrollTop = c.scrollHeight;
        }

        setInterval(loop, 3000);
        loop();
    </script>
</body>
</html>
