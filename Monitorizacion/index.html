<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUX ROOT ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --terminal-green: #33ff00;
            --terminal-dim: #1a8000;
            --alert: #ff0000;
            --warn: #ffcc00;
            --scanline: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-color);
            color: var(--terminal-green);
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow-x: hidden;
            text-shadow: 0 0 2px var(--terminal-dim);
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EFECTO MONITOR CRT (SCANLINES) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* HEADER */
        header {
            width: 100%; max-width: 1100px;
            border-bottom: 2px solid var(--terminal-green);
            padding-bottom: 10px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 3;
        }
        h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* HOST MONITOR (ASCII STYLE) */
        .host-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            width: 100%; max-width: 1100px;
            border: 1px solid var(--terminal-dim);
            padding: 15px; margin-bottom: 30px;
            background: rgba(0, 20, 0, 0.8);
            z-index: 3;
        }
        .stat-box { text-align: center; border-right: 1px dashed var(--terminal-dim); }
        .stat-box:last-child { border-right: none; }
        .big-num { font-size: 2.5rem; font-weight: bold; }
        
        /* SERVER GRID */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; width: 100%; max-width: 1100px; z-index: 3;
        }

        /* HACKER CARD */
        .card {
            border: 1px solid var(--terminal-green);
            background: #000;
            padding: 15px;
            position: relative;
            transition: all 0.1s;
        }
        .card:hover {
            box-shadow: 0 0 15px var(--terminal-dim);
            transform: scale(1.01);
        }
        .card.stopped { border-color: var(--alert); color: var(--alert); }
        .card.stopped button { border-color: var(--alert); color: var(--alert); }
        .card.stopped .card-title { color: var(--alert); }

        .card-header { 
            border-bottom: 1px dashed var(--terminal-green); 
            padding-bottom: 5px; margin-bottom: 10px;
            display: flex; justify-content: space-between;
        }
        .vm-details { font-size: 0.9rem; margin-bottom: 15px; opacity: 0.8; }

        /* BUTTONS */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button {
            background: black; color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            font-family: 'VT323', monospace;
            font-size: 1.2rem; cursor: pointer;
            padding: 5px; text-transform: uppercase;
        }
        button:hover { background: var(--terminal-green); color: black; }
        button:disabled { opacity: 0.3; cursor: not-allowed; border-style: dashed; }
        
        .btn-snap { grid-column: span 2; border-color: var(--warn); color: var(--warn); }
        .btn-snap:hover { background: var(--warn); color: black; }

        /* LOG TERMINAL */
        .terminal-log {
            width: 100%; max-width: 1100px;
            background: #000;
            border: 1px solid var(--terminal-dim);
            height: 200px; margin-top: 30px;
            padding: 10px;
            overflow-y: scroll;
            font-size: 1rem;
            z-index: 3;
        }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #111; }
        .log-time { color: var(--terminal-dim); margin-right: 10px; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--terminal-dim); border: 1px solid var(--terminal-green); }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>> LINUX_SYSTEM_CONTROL<span class="blink">_</span></h1>
            <small>ACCESS LEVEL: ROOT | ENCRYPTION: ON</small>
        </div>
        <div style="text-align: right;">
            <div>STATUS: <span id="conn-status">CONNECTING...</span></div>
            <div>UPTIME: <span id="uptime">00:00:00</span></div>
        </div>
    </header>

    <div class="host-stats">
        <div class="stat-box">
            <div>HOST_CPU_LOAD</div>
            <div id="host-cpu" class="big-num">0%</div>
            <div id="cpu-bar">----</div>
        </div>
        <div class="stat-box">
            <div>PHYSICAL_MACHINE</div>
            <div class="big-num">LINUX</div>
            <div>KERNEL MODE</div>
        </div>
        <div class="stat-box">
            <div>RAM_USAGE</div>
            <div id="host-ram" class="big-num">0%</div>
            <div id="ram-bar">----</div>
        </div>
    </div>

    <div id="grid" class="grid">
        </div>

    <div class="terminal-log" id="syslog">
        <div class="log-line">> INITIALIZING SYSTEM INTERFACE...</div>
        <div class="log-line">> WAITING FOR BACKEND HANDSHAKE...</div>
    </div>

    <script>
        const API = 'http://localhost:8000';
        let isConnected = false;

        async function refreshSystem() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                
                if (!isConnected) {
                    log("CONNECTION ESTABLISHED WITH HOST.");
                    document.getElementById('conn-status').innerText = "ONLINE";
                    document.getElementById('conn-status').style.color = "#33ff00";
                    isConnected = true;
                }
                
                renderDashboard(data);
            } catch (e) {
                if (isConnected) {
                    log("CRITICAL: CONNECTION LOST WITH BACKEND.");
                    document.getElementById('conn-status').innerText = "OFFLINE";
                    document.getElementById('conn-status').style.color = "red";
                    isConnected = false;
                }
            }
        }

        function renderDashboard(data) {
            // Update Host Stats
            document.getElementById('host-cpu').innerText = data.host.cpu + '%';
            document.getElementById('host-ram').innerText = data.host.ram + '%';
            
            // Visual bars (fake ASCII bars)
            document.getElementById('cpu-bar').innerText = generateBar(data.host.cpu);
            document.getElementById('ram-bar').innerText = generateBar(data.host.ram);

            // Render VMs
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            data.vms.forEach(vm => {
                const isOn = vm.status === 'running';
                const statusTxt = isOn ? 'ACTIVE' : 'HALTED';
                const statusClass = isOn ? 'running' : 'stopped';
                
                const card = document.createElement('div');
                card.className = `card ${statusClass}`;
                card.innerHTML = `
                    <div class="card-header">
                        <strong>[ ${vm.name} ]</strong>
                        <span>${statusTxt}</span>
                    </div>
                    <div class="vm-details">
                        >> MEM_ALLOC: ${vm.ram_assigned}<br>
                        >> CPU_CORES: ${vm.cpus}
                    </div>
                    <div class="actions">
                        <button onclick="exec('${vm.name}', 'start')" ${isOn ? 'disabled' : ''}>INIT</button>
                        <button onclick="exec('${vm.name}', 'stop')" ${!isOn ? 'disabled' : ''}>KILL</button>
                        <button class="btn-snap" onclick="exec('${vm.name}', 'snapshot')">CREATE_SNAPSHOT</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function exec(name, action) {
            log(`> EXECUTING ${action.toUpperCase()} ON TARGET: ${name}...`);
            try {
                await fetch(`${API}/${action}?name=${name}`);
                setTimeout(refreshSystem, 1000); // Fast refresh
            } catch(e) {
                log(`> ERROR: COMMAND FAILED FOR ${name}`);
            }
        }

        function generateBar(percent) {
            const chars = Math.floor(percent / 10);
            return '[' + '#'.repeat(chars) + '-'.repeat(10 - chars) + ']';
        }

        function log(msg) {
            const term = document.getElementById('syslog');
            const now = new Date().toLocaleTimeString();
            term.innerHTML += `<div class="log-line"><span class="log-time">${now}</span> ${msg}</div>`;
            term.scrollTop = term.scrollHeight; // Auto scroll
        }

        // Uptime Clock
        let sec = 0;
        setInterval(() => {
            sec++;
            const date = new Date(0);
            date.setSeconds(sec);
            document.getElementById('uptime').innerText = date.toISOString().substr(11, 8);
        }, 1000);

        // Main Loop
        setInterval(refreshSystem, 3000);
        refreshSystem();

    </script>
</body>
</html>
