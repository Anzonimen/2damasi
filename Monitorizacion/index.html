<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaMaX Admin Pro</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #38bdf8;
            --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* HOST MONITOR HEADER */
        .host-monitor {
            width: 100%; max-width: 1000px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155; border-radius: 15px;
            padding: 20px; margin-bottom: 30px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
        }
        .monitor-metric { text-align: center; }
        .metric-value { font-size: 2.5rem; font-weight: bold; color: var(--accent); }
        .metric-label { font-size: 0.9rem; color: #94a3b8; letter-spacing: 1px; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        
        /* CARDS */
        .card {
            background: var(--card); border-radius: 12px; padding: 20px;
            border-top: 4px solid #64748b; position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card.running { border-top-color: var(--success); }
        .card.stopped { border-top-color: var(--danger); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .vm-specs { font-size: 0.8rem; color: #94a3b8; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 5px; margin-bottom: 15px; }

        /* BUTTONS */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { border: none; padding: 10px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; opacity: 0.9; transition: 0.2s; }
        button:hover { opacity: 1; transform: scale(1.02); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-snap { background: var(--accent); grid-column: span 2; margin-top: 5px; color: #0f172a;}

        .log-box { width: 100%; max-width: 1000px; background: black; color: #22c55e; font-family: monospace; padding: 10px; margin-top: 20px; border-radius: 8px; max-height: 150px; overflow-y: auto; font-size: 0.85rem;}
    </style>
</head>
<body>

    <div class="host-monitor">
        <div class="monitor-metric">
            <div class="metric-label">HOST CPU</div>
            <div id="host-cpu" class="metric-value">0%</div>
        </div>
        <div class="monitor-metric">
            <div style="font-size:3rem">🖥️</div>
            <div class="metric-label">EDUCA-MAX</div>
        </div>
        <div class="monitor-metric">
            <div class="metric-label">HOST RAM</div>
            <div id="host-ram" class="metric-value">0%</div>
        </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="logs" class="log-box">System ready...</div>

    <script>
        const API = 'http://localhost:8000';

        async function update() {
            try {
                const res = await fetch(`${API}/status`);
                const data = await res.json();
                render(data);
            } catch (e) {
                log('Error de conexión con Backend...');
            }
        }

        function render(data) {
            // 1. Actualizar Host Stats
            document.getElementById('host-cpu').innerText = data.host.cpu + '%';
            document.getElementById('host-ram').innerText = data.host.ram + '%';

            // 2. Actualizar VMs
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            data.vms.forEach(vm => {
                const isOn = vm.status === 'running';
                const div = document.createElement('div');
                div.className = `card ${vm.status}`;
                div.innerHTML = `
                    <div class="card-header">
                        <h2>${vm.name}</h2>
                        <span style="color:${isOn ? 'var(--success)' : 'var(--danger)'}">
                            ● ${isOn ? 'RUNNING' : 'STOPPED'}
                        </span>
                    </div>
                    
                    <div class="vm-specs">
                        💾 RAM: ${vm.ram_assigned}MB | 🧠 CPU: ${vm.cpus} Core(s)
                    </div>

                    <div class="btn-group">
                        <button class="btn-start" onclick="cmd('start','${vm.name}')" ${isOn?'disabled':''}>▶ START</button>
                        <button class="btn-stop" onclick="cmd('stop','${vm.name}')" ${!isOn?'disabled':''}>⏹ STOP</button>
                        <button class="btn-snap" onclick="cmd('snapshot','${vm.name}')">📸 BACKUP SNAPSHOT</button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        async function cmd(action, name) {
            log(`Enviando comando: ${action} -> ${name}...`);
            await fetch(`${API}/${action}?name=${name}`);
            setTimeout(update, 1000);
        }

        function log(msg) {
            const box = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            box.innerHTML = `[${time}] ${msg}<br>` + box.innerHTML;
        }

        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
